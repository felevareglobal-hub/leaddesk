<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeadDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#EEF2F4;--panel:#fff;--ink:#13242D;--mute:#62747E;--line:#D9E1E5;--accent:#0E6B66;--open:#2B6CB0;--won:#2F855A;--lost:#B94A48;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--r);padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--lost);border:1px solid var(--line)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
#auth{max-width:380px;margin:12vh auto;padding:28px;background:var(--panel);border-radius:12px;border:1px solid var(--line)}
#auth h1{margin:0 0 4px;font-size:26px}
#auth p{margin:0 0 20px;color:var(--mute)}
#auth .btn{width:100%}
.swap{margin-top:14px;text-align:center;color:var(--mute);font-size:14px}
.swap a{color:var(--accent);cursor:pointer;font-weight:600}
.err{color:var(--lost);font-size:14px;min-height:20px;margin-bottom:8px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--ink);color:#fff}
header b{font-size:18px}
header span{opacity:.7;margin-left:10px;font-size:14px}
header button{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:var(--r);padding:6px 12px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.pipe{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.pipe button{flex:1;background:transparent;border:0;border-right:1px solid var(--line);padding:12px 10px 10px;text-align:left;border-bottom:4px solid transparent}
.pipe button:last-child{border-right:0}
.pipe button b{display:block;font-size:22px;line-height:1.1}
.pipe button small{color:var(--mute)}
.pipe button.on{background:#F4F8F8;border-bottom-color:var(--c,var(--accent))}
.k-open{--c:var(--open)}.k-won{--c:var(--won)}.k-lost{--c:var(--lost)}
.bar{display:flex;gap:10px;margin-bottom:12px}
.bar input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.row{display:grid;grid-template-columns:2fr 1.3fr 1.1fr 1.1fr;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--c,var(--line));cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#F8FAFB}
.row .n{font-weight:600}
.row .s{color:var(--mute);font-size:13px}
.row select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
.late{color:var(--lost);font-weight:600}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}dialog{max-height:92vh;overflow:auto}.mem{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 18px;font-weight:600}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kpi{border-radius:10px;padding:14px;color:#fff;background-image:linear-gradient(135deg,#ffffff30,#00000018)}.kpi b{display:block;font-size:26px;line-height:1.15}.kpi small{opacity:.92}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}.card h3{margin:0 0 12px;font-size:15px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dw{position:relative;width:130px;height:130px;flex:none}.dw div{width:100%;height:100%;border-radius:50%}.dw::after{content:attr(data-t);position:absolute;inset:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.lg{font-size:13px;margin-bottom:4px}
.mon{display:flex;align-items:flex-end;gap:10px;height:160px}.mcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;min-height:2px}.stack i{display:block}.mcol small{margin-top:6px;color:var(--mute);font-size:12px}
.hb{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}.hb div{background:#EEF2F4;border-radius:4px;height:10px}.hb i{display:block;height:100%;border-radius:4px}
.irow{display:grid;grid-template-columns:2fr 1.3fr .7fr 1fr 1fr auto;gap:6px;margin-bottom:8px}.irow input{padding:8px;border:1px solid var(--line);border-radius:6px;min-width:0}.irow .x{border:1px solid var(--line);background:#fff;border-radius:6px;width:32px}
.tbl{border-collapse:collapse;width:100%;font-size:13px}.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.tbl th{background:#F4F8F8}
.bar select{padding:9px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
@media(max-width:640px){.irow{grid-template-columns:1fr 1fr}}
.kpi.click{cursor:pointer}.kpi.click:hover{filter:brightness(1.08)}.kpi.sel{outline:3px solid var(--ink);outline-offset:2px}.dtl tr[data-id]{cursor:pointer}.dtl tr[data-id]:hover{background:#F8FAFB}
.click{cursor:pointer}.lg.click:hover,.hb.click:hover,.mcol small.click:hover{text-decoration:underline}.stack i.click:hover{filter:brightness(1.15)}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:12px;padding:22px;width:min(620px,94vw);box-shadow:0 12px 40px #0004}
dialog::backdrop{background:#13242D88}
dialog h2{margin:0 0 14px;font-size:19px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.acts .sp{margin-right:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r)}
@media(max-width:640px){.row{grid-template-columns:1fr 1fr}.pipe{overflow-x:auto}.pipe button{min-width:96px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<section id="auth" class="hide">
  <h1>LeadDesk</h1>
  <p id="authSub">Sign in to your workspace.</p>
  <label class="field hide" id="bizWrap"><span>Business name</span><input id="biz" autocomplete="organization"></label>
  <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email"></label>
  <label class="field"><span>Password</span><input id="pass" type="password" autocomplete="current-password"></label>
  <div class="err" id="authErr"></div>
  <button class="btn" id="authBtn">Sign in</button>
  <div class="swap" id="swap"></div>
</section>

<div id="app" class="hide">
  <header><div><b>LeadDesk</b><span id="wsName"></span></div><div><button id="teamBtn" class="hide">Team</button> <button id="logout">Sign out</button></div></header>
  <main>
    <nav class="tabs" id="tabs"><button data-v="leads">Leads</button><button data-v="dash">Dashboard</button><button data-v="rep">Reports</button></nav>
    <div id="vDash" class="hide"></div><div id="vRep" class="hide"></div>
    <div id="vLeads">
    <div class="pipe" id="pipe"></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search by name, phone, email or source">
      <button class="btn" id="add">Add lead</button>
    </div>
    <div class="list" id="list"></div>
    </div>
  </main>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle">Add lead</h2>
  <label class="field"><span>Customer / company</span><input id="f_name"></label>
  <div class="two">
    <label class="field"><span>Phone</span><input id="f_phone" type="tel"></label>
    <label class="field"><span>Email</span><input id="f_email" type="email"></label>
  </div>
  <div style="font-weight:600;margin:4px 0 6px">Items</div>
  <div id="itemRows"></div>
  <button class="btn ghost" id="addItem" type="button" style="margin-bottom:12px">Add item</button>
  <div class="two">
    <label class="field"><span>Follow-up on</span><input id="f_follow_up_on" type="date"></label>
    <label class="field"><span>Status</span><select id="f_stage"></select></label>
  </div>
  <label class="field hide" id="wonWrap"><span>Final price (deal won)</span><input id="f_won_price" type="number" min="0" step="any"></label>
  <label class="field hide" id="lostWrap"><span>Reason for loss</span><input id="f_lost_reason" list="reasons"></label>
  <datalist id="reasons"><option>Price too high</option><option>Went with competitor</option><option>No budget</option><option>No response</option><option>Item unavailable</option><option>Requirement cancelled</option></datalist>
  <label class="field"><span>Assigned to</span><select id="f_assign"></select></label>
  <label class="field"><span>Source</span><input id="f_source" list="srcs"></label>
  <datalist id="srcs"><option>Website</option><option>Referral</option><option>WhatsApp</option><option>Walk-in</option><option>Instagram</option><option>Phone call</option></datalist>
  <label class="field"><span>Notes</span><textarea id="f_notes" rows="3"></textarea></label>
  <div class="err" id="dlgErr"></div>
  <div class="acts">
    <button class="btn danger sp hide" id="del">Delete lead</button>
    <button class="btn ghost" id="wa" type="button">Share on WhatsApp</button>
    <button class="btn ghost" id="cancel">Cancel</button>
    <button class="btn" id="save">Save lead</button>
  </div>
</dialog>
<dialog id="teamDlg">
  <h2>Team</h2>
  <div id="teamList"></div>
  <p style="color:var(--mute);font-size:13px">First create the user in Supabase (Authentication, Users), then add their email here.</p>
  <label class="field"><span>Email</span><input id="t_email" type="email"></label>
  <label class="field"><span>Role</span><select id="t_role"><option value="agent">Agent</option><option value="owner">Owner</option></select></label>
  <div class="err" id="teamErr"></div>
  <div class="acts"><button class="btn ghost" id="teamClose">Close</button><button class="btn" id="teamAdd">Add to team</button></div>
</dialog>
<div id="toast" class="hide"></div>

<script>
const SUPABASE_URL = 'https://mbmrzyhcjivrbiaayiah.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NS2LViVIr9dN1UJ_Qjralg_fPdxOnHA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S = { dk: '', view: 'leads', items: [], repY: String(new Date().getFullYear()), repM: '', role: '', team: [], ws: null, wsName: '', stages: [], leads: [], filter: 'all', q: '', editId: null, mode: 'login' };
const $ = id => document.getElementById(id);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hide');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.add('hide'), 2200);
}

/* ---------- Auth ---------- */
function setMode(m) {
  S.mode = m;
  const signup = m === 'signup';
  $('bizWrap').classList.toggle('hide', !signup);
  $('authSub').textContent = signup ? 'Create a workspace for your business.' : 'Sign in to your workspace.';
  $('authBtn').textContent = signup ? 'Create workspace' : 'Sign in';
  $('pass').autocomplete = signup ? 'new-password' : 'current-password';
  $('swap').innerHTML = signup
    ? 'Already have a workspace? <a id="swapLink">Sign in</a>'
    : 'New here? <a id="swapLink">Create a workspace</a>';
  $('swapLink').onclick = () => setMode(signup ? 'login' : 'signup');
  $('authErr').textContent = '';
}

async function submitAuth() {
  const email = $('email').value.trim(), password = $('pass').value, biz = $('biz').value.trim();
  $('authErr').textContent = '';
  if (!email || !password) { $('authErr').textContent = 'Enter your email and password.'; return; }
  if (S.mode === 'signup') {
    if (!biz) { $('authErr').textContent = 'Enter your business name.'; return; }
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { business: biz } } });
    if (error) { $('authErr').textContent = error.message; return; }
    if (!data.session) { $('authErr').textContent = 'Check your email to confirm your account, then sign in.'; setMode('login'); return; }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { $('authErr').textContent = error.message; return; }
  }
  boot();
}

/* ---------- Data ---------- */
async function loadWorkspace(user) {
  let { data: m } = await sb.from('ld_members').select('workspace_id, role, ld_workspaces(name)').limit(1);
  if (!m || !m.length) {
    const name = (user.user_metadata && user.user_metadata.business) || 'My business';
    const { error } = await sb.rpc('ld_create_workspace', { wname: name });
    if (error) { toast(error.message); return false; }
    ({ data: m } = await sb.from('ld_members').select('workspace_id, role, ld_workspaces(name)').limit(1));
  }
  S.ws = m[0].workspace_id;
  S.role = m[0].role;
  S.wsName = m[0].ld_workspaces ? m[0].ld_workspaces.name : '';
  return true;
}

async function loadData() {
  const [st, ld, tm, it] = await Promise.all([
    sb.from('ld_stages').select('*').eq('workspace_id', S.ws).order('position'),
    sb.from('ld_leads').select('*').eq('workspace_id', S.ws).order('created_at', { ascending: false }),
    sb.rpc('ld_team', { wid: S.ws }),
    sb.from('ld_items').select('*').eq('workspace_id', S.ws).order('position')
  ]);
  if (st.error || ld.error) { toast((st.error || ld.error).message); return; }
  S.stages = st.data;
  S.leads = ld.data;
  S.team = tm.data || [];
  S.items = it.data || [];
}

/* ---------- Render ---------- */
const stageOf = id => S.stages.find(s => s.id === id);

function renderPipe() {
  const count = id => S.leads.filter(l => l.stage_id === id).length;
  let h = '<button data-f="all" class="' + (S.filter === 'all' ? 'on' : '') + '"><b>' + S.leads.length + '</b><small>All leads</small></button>';
  S.stages.forEach(s => {
    h += '<button data-f="' + s.id + '" class="k-' + s.kind + (S.filter === s.id ? ' on' : '') + '"><b>' + count(s.id) + '</b><small>' + esc(s.name) + '</small></button>';
  });
  $('pipe').innerHTML = h;
  $('pipe').querySelectorAll('button').forEach(b => b.onclick = () => { S.filter = b.dataset.f; render(); });
}

const num = v => (v == null || v === '') ? '-' : Number(v).toLocaleString('en-IN');
const who = id => { const t = S.team.find(x => x.user_id === id); return t ? t.email.split('@')[0] : 'Unassigned'; };

function renderList() {
  const q = S.q.toLowerCase();
  const today = new Date().toLocaleDateString('en-CA');
  const rows = S.leads.filter(l => {
    if (S.filter !== 'all' && l.stage_id !== S.filter) return false;
    if (!q) return true;
    return [l.name, l.phone, l.email, l.source, l.lost_reason, itemLine(itemsOf(l.id), true)].some(v => (v || '').toLowerCase().includes(q));
  });
  if (!rows.length) {
    $('list').innerHTML = '<div class="empty">' + (S.leads.length ? 'No leads match this view.' : 'No leads yet. Select Add lead to enter your first one.') + '</div>';
    return;
  }
  $('list').innerHTML = rows.map(l => {
    const st = stageOf(l.stage_id);
    const opts = S.stages.map(s => '<option value="' + s.id + '"' + (s.id === l.stage_id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('');
    const its = itemsOf(l.id);
    const late = l.follow_up_on && l.follow_up_on < today && st && st.kind === 'open';
    const outcome = st && st.kind === 'won' && l.won_price != null ? '<br><b style="color:var(--won)">Won at ' + num(l.won_price) + '</b>' : (st && st.kind === 'lost' && l.lost_reason ? '<br><b style="color:var(--lost)">Lost: ' + esc(l.lost_reason) + '</b>' : '');
    return '<div class="row k-' + (st ? st.kind : 'open') + '" data-id="' + l.id + '">' +
      '<div><div class="n">' + esc(l.name) + '</div><div class="s">' + esc(itemLine(its) || l.phone || l.email || 'No item') + '</div></div>' +
      '<div class="s">' + its.length + (its.length === 1 ? ' item' : ' items') + ' \u00b7 Qty ' + num(its.reduce((a, i) => a + (Number(i.quantity) || 0), 0)) + '<br>Quoted ' + num(sum(its, 'price_quoted')) + ' \u00b7 Target ' + num(sum(its, 'target_price')) + outcome + '</div>' +
      '<div><select data-stage="' + l.id + '" aria-label="Status">' + opts + '</select></div>' +
      '<div class="s">' + esc(who(l.assigned_to)) + '<br><span class="' + (late ? 'late' : '') + '">' + (l.follow_up_on ? 'Follow up ' + l.follow_up_on : 'No follow-up') + '</span></div></div>';
  }).join('');
  $('list').querySelectorAll('.row').forEach(r => r.onclick = () => openLead(r.dataset.id));
  $('list').querySelectorAll('select[data-stage]').forEach(s => {
    s.onclick = e => e.stopPropagation();
    s.onchange = () => changeStage(s.dataset.stage, s.value);
  });
}

function render() {
  $('wsName').textContent = S.wsName;
  $('teamBtn').classList.toggle('hide', S.role !== 'owner');
  renderPipe();
  renderList();
  renderView();
}

/* ---------- Lead actions ---------- */
async function changeStage(id, stageId) {
  const target = stageOf(stageId);
  if (target && target.kind !== 'open') { render(); openLead(id, stageId); return; }
  const { error } = await sb.from('ld_leads').update({ stage_id: stageId, won_price: null, lost_reason: null }).eq('id', id);
  if (error) { toast(error.message); return; }
  const l = S.leads.find(x => x.id === id);
  if (l) l.stage_id = stageId;
  render();
  toast('Stage updated');
}

function syncOutcome() {
  const st = stageOf($('f_stage').value);
  $('wonWrap').classList.toggle('hide', !st || st.kind !== 'won');
  $('lostWrap').classList.toggle('hide', !st || st.kind !== 'lost');
}

function openLead(id, presetStage) {
  S.editId = id || null;
  const l = id ? S.leads.find(x => x.id === id) : null;
  $('dlgTitle').textContent = l ? 'Edit lead' : 'Add lead';
  $('f_stage').innerHTML = S.stages.map(s => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join('');
  $('f_name').value = l ? l.name : '';
  $('f_phone').value = l ? l.phone || '' : '';
  $('f_email').value = l ? l.email || '' : '';
  $('f_source').value = l ? l.source || '' : '';
  $('f_notes').value = l ? l.notes || '' : '';
  $('f_stage').value = l ? l.stage_id : (S.stages[0] ? S.stages[0].id : '');
  $('f_assign').innerHTML = '<option value="">Unassigned</option>' + S.team.map(t => '<option value="' + t.user_id + '">' + esc(t.email) + '</option>').join('');
  $('itemRows').innerHTML = '';
  const its0 = l ? itemsOf(l.id) : [];
  (its0.length ? its0 : [{}]).forEach(addItemRow);
  ['follow_up_on', 'won_price', 'lost_reason'].forEach(k => { $('f_' + k).value = l && l[k] != null ? l[k] : ''; });
  $('f_assign').value = l && l.assigned_to ? l.assigned_to : '';
  if (presetStage) $('f_stage').value = presetStage;
  syncOutcome();
  $('del').classList.toggle('hide', !l);
  $('dlgErr').textContent = '';
  $('dlg').showModal();
}

async function saveLead() {
  const name = $('f_name').value.trim();
  if (!name) { $('dlgErr').textContent = 'Enter the lead\u2019s name.'; return; }
  const st = stageOf($('f_stage').value);
  const kind = st ? st.kind : 'open';
  if (kind === 'won' && !$('f_won_price').value) { $('dlgErr').textContent = 'Enter the final price for a won deal.'; return; }
  if (kind === 'lost' && !$('f_lost_reason').value.trim()) { $('dlgErr').textContent = 'Enter the reason for loss.'; return; }
  const row = {
    name, phone: $('f_phone').value.trim() || null, email: $('f_email').value.trim() || null,
    source: $('f_source').value.trim() || null, stage_id: $('f_stage').value, notes: $('f_notes').value.trim() || null,
    follow_up_on: $('f_follow_up_on').value || null,
    assigned_to: $('f_assign').value || null,
    won_price: kind === 'won' ? $('f_won_price').value : null,
    lost_reason: kind === 'lost' ? $('f_lost_reason').value.trim() : null
  };
  let id = S.editId;
  let res;
  if (id) res = await sb.from('ld_leads').update(row).eq('id', id);
  else {
    res = await sb.from('ld_leads').insert({ ...row, workspace_id: S.ws }).select('id').single();
    if (!res.error) id = res.data.id;
  }
  if (res.error) { $('dlgErr').textContent = res.error.message; return; }
  const items = readItems().map((x, i) => ({ ...x, lead_id: id, workspace_id: S.ws, position: i }));
  const dl = await sb.from('ld_items').delete().eq('lead_id', id);
  if (dl.error) { $('dlgErr').textContent = dl.error.message; return; }
  if (items.length) {
    const ins = await sb.from('ld_items').insert(items);
    if (ins.error) { $('dlgErr').textContent = ins.error.message; return; }
  }
  $('dlg').close();
  await loadData();
  render();
  toast('Lead saved');
}

async function deleteLead() {
  if (!S.editId || !confirm('Delete this lead? This cannot be undone.')) return;
  const { error } = await sb.from('ld_leads').delete().eq('id', S.editId);
  if (error) { $('dlgErr').textContent = error.message; return; }
  $('dlg').close();
  await loadData();
  render();
  toast('Lead deleted');
}

/* ---------- Team ---------- */
function renderTeam() {
  $('teamList').innerHTML = S.team.map(t => '<div class="mem"><span>' + esc(t.email) + '</span><span>' + esc(t.role) + '</span></div>').join('');
}

async function addMember() {
  const email = $('t_email').value.trim();
  if (!email) { $('teamErr').textContent = 'Enter an email.'; return; }
  const { error } = await sb.rpc('ld_add_member', { wid: S.ws, memail: email, mrole: $('t_role').value });
  if (error) { $('teamErr').textContent = error.message; return; }
  $('t_email').value = '';
  $('teamErr').textContent = '';
  await loadData();
  renderTeam();
  toast('Team member added');
}

/* ---------- Items, dashboard, reports ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const PAL = ['#4F46E5', '#0EA5E9', '#14B8A6', '#F59E0B', '#EC4899', '#8B5CF6', '#22C55E', '#EF4444'];
const itemsOf = id => S.items.filter(i => i.lead_id === id);
const sum = (its, k) => its.reduce((a, i) => a + (Number(i.quantity) || 1) * (Number(i[k]) || 0), 0);
const kindOf = l => { const s = stageOf(l.stage_id); return s ? s.kind : 'open'; };
const ym = iso => { const x = new Date(iso); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); };
const nv = v => (v == null || v === '') ? '' : Number(v);
const kpi = k => '<div class="kpi' + (k[3] ? ' click' + (S.dk === k[3] ? ' sel' : '') + '" data-k="' + k[3] : '') + '" style="background-color:' + k[2] + '"><b>' + k[1] + '</b><small>' + esc(k[0]) + '</small></div>';
const itemLine = (its, all) => all
  ? its.map(i => [i.item, i.part_no].filter(Boolean).join(' ')).join(' ')
  : (its.length ? [its[0].item, its[0].part_no].filter(Boolean).join(' \u00b7 ') + (its.length > 1 ? ' +' + (its.length - 1) + ' more' : '') : '');

function addItemRow(it) {
  it = it || {};
  const d = document.createElement('div');
  d.className = 'irow';
  d.innerHTML = '<input class="i_item" placeholder="Item" value="' + esc(it.item) + '">' +
    '<input class="i_part" placeholder="Part / Model No" value="' + esc(it.part_no) + '">' +
    '<input class="i_qty" type="number" min="0" step="any" placeholder="Qty" value="' + esc(it.quantity) + '">' +
    '<input class="i_quoted" type="number" min="0" step="any" placeholder="Price quoted" value="' + esc(it.price_quoted) + '">' +
    '<input class="i_target" type="number" min="0" step="any" placeholder="Target price" value="' + esc(it.target_price) + '">' +
    '<button type="button" class="x" aria-label="Remove item">&times;</button>';
  d.querySelector('.x').onclick = () => d.remove();
  $('itemRows').appendChild(d);
}

function readItems() {
  return [...document.querySelectorAll('#itemRows .irow')].map(d => ({
    item: d.querySelector('.i_item').value.trim() || null,
    part_no: d.querySelector('.i_part').value.trim() || null,
    quantity: d.querySelector('.i_qty').value || null,
    price_quoted: d.querySelector('.i_quoted').value || null,
    target_price: d.querySelector('.i_target').value || null
  })).filter(x => x.item || x.part_no || x.quantity || x.price_quoted || x.target_price);
}

function waMessage(name, items) {
  const lines = items.map((i, n) => {
    const q = Number(i.quantity) || 1, pr = Number(i.price_quoted);
    return (n + 1) + '. ' + ([i.item, i.part_no].filter(Boolean).join(' - ') || 'Item') + ': ' + q + ' x ' + num(pr) + ' = ' + num(q * pr);
  });
  return 'Hello ' + name + ',\n\nThank you for your enquiry. Our quotation:\n\n' + lines.join('\n') + '\n\nTotal: ' + num(sum(items, 'price_quoted')) + '\n\nRegards,\n' + S.wsName;
}

function shareWhatsApp() {
  const items = readItems().filter(i => i.price_quoted);
  if (!items.length) { $('dlgErr').textContent = 'Add at least one item with a quoted price to share.'; return; }
  let ph = $('f_phone').value.replace(/\D/g, '').replace(/^0+/, '');
  if (!ph) { $('dlgErr').textContent = 'Enter the customer\u2019s phone number first.'; return; }
  if (ph.length === 10) ph = '91' + ph;
  $('dlgErr').textContent = '';
  window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent(waMessage($('f_name').value.trim() || 'there', items)), '_blank');
}

function renderView() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  $('vLeads').classList.toggle('hide', S.view !== 'leads');
  $('vDash').classList.toggle('hide', S.view !== 'dash');
  $('vRep').classList.toggle('hide', S.view !== 'rep');
  if (S.view === 'dash') renderDash();
  if (S.view === 'rep') renderRep();
}

function hbars(rows, pre) {
  if (!rows.length) return '<div class="s">Nothing to show yet.</div>';
  const mx = Math.max(1, ...rows.map(r => r[1]));
  return rows.map(r => '<div class="hb' + (pre ? ' click' : '') + '"' + (pre ? ' data-k="' + esc(pre + r[3]) + '"' : '') + '><span>' + esc(r[0]) + '</span><div><i style="width:' + (r[1] / mx * 100) + '%;background:' + r[2] + '"></i></div><b>' + r[1] + '</b></div>').join('');
}

function countBy(ls, fn, lab) {
  const m = {};
  ls.forEach(l => { const k = fn(l); m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]).map((e, i) => [lab ? lab(e[0]) : e[0], e[1], PAL[i % PAL.length], e[0]]);
}

function pick(k) {
  S.dk = S.dk === k ? '' : k;
  renderDash();
  const c = $('dkCard');
  if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function dashDetail(today) {
  if (!S.dk) return '';
  const by = k => S.leads.filter(l => kindOf(l) === k);
  const qv = l => sum(itemsOf(l.id), 'price_quoted');
  const dyn = () => {
    const p = S.dk.split(':'), t = p[0], a = p[1], b = p.slice(1).join(':');
    if (t === 'st') { const s = stageOf(a); return [S.leads.filter(l => l.stage_id === a), 'Status: ' + (s ? s.name : '')]; }
    if (t === 'mo') {
      const ls = S.leads.filter(l => ym(l.created_at) === a && (!p[2] || kindOf(l) === p[2]));
      return [ls, MON[Number(a.slice(5)) - 1] + ' ' + a.slice(0, 4) + (p[2] ? ' (' + p[2] + ')' : ' leads')];
    }
    if (t === 'lr') return [by('lost').filter(l => (l.lost_reason || 'No reason') === b), 'Lost: ' + b];
    if (t === 'tm') return [S.leads.filter(l => (l.assigned_to || 'none') === b), 'Assigned to ' + (b === 'none' ? 'nobody' : who(b))];
    return [[], ''];
  };
  const F = {
    all: [S.leads, 'All leads'], open: [by('open'), 'Open leads'], won: [by('won'), 'Won deals'], lost: [by('lost'), 'Lost leads'],
    wonv: [by('won').sort((a, b) => (Number(b.won_price) || 0) - (Number(a.won_price) || 0)), 'Won deals by value'],
    openv: [by('open').sort((a, b) => qv(b) - qv(a)), 'Open quotes by value'],
    today: [by('open').filter(l => l.follow_up_on === today), 'Follow-ups due today'],
    over: [by('open').filter(l => l.follow_up_on && l.follow_up_on < today), 'Overdue follow-ups']
  }[S.dk] || dyn();
  const ls = F[0];
  const rows = ls.map(l => {
    const st = stageOf(l.stage_id), its = itemsOf(l.id);
    return '<tr data-id="' + l.id + '"><td>' + new Date(l.created_at).toLocaleDateString('en-GB') + '</td><td><b>' + esc(l.name) + '</b></td><td>' + esc(itemLine(its) || '-') + '</td><td>' + num(qv(l)) + '</td><td>' + esc(st ? st.name : '') + '</td><td>' + esc(l.assigned_to ? who(l.assigned_to) : 'Unassigned') + '</td><td>' + esc(l.follow_up_on || '') + '</td><td>' + (kindOf(l) === 'won' ? num(l.won_price) : esc(l.lost_reason || '')) + '</td></tr>';
  }).join('');
  return '<div class="card" id="dkCard"><h3>' + esc(F[1]) + ' (' + ls.length + ') <a id="dkClose" style="float:right;font-weight:400;color:var(--accent);cursor:pointer">Close</a></h3>' +
    (ls.length ? '<div style="overflow-x:auto"><table class="tbl dtl"><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Quoted value</th><th>Status</th><th>Assigned to</th><th>Follow-up</th><th>Won price / Lost reason</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">No leads here.</div>') + '</div>';
}

function renderDash() {
  const today = new Date().toLocaleDateString('en-CA');
  const open = S.leads.filter(l => kindOf(l) === 'open');
  const won = S.leads.filter(l => kindOf(l) === 'won');
  const lost = S.leads.filter(l => kindOf(l) === 'lost');
  const wonVal = won.reduce((a, l) => a + (Number(l.won_price) || 0), 0);
  const openVal = open.reduce((a, l) => a + sum(itemsOf(l.id), 'price_quoted'), 0);
  const K = [['Total leads', S.leads.length, '#4F46E5', 'all'], ['Open', open.length, '#0EA5E9', 'open'], ['Won', won.length, '#16A34A', 'won'], ['Lost', lost.length, '#DC2626', 'lost'],
    ['Won value', num(wonVal), '#0D9488', 'wonv'], ['Open quotes value', num(openVal), '#D97706', 'openv'],
    ['Follow-ups today', open.filter(l => l.follow_up_on === today).length, '#7C3AED', 'today'], ['Overdue follow-ups', open.filter(l => l.follow_up_on && l.follow_up_on < today).length, '#EA580C', 'over']];
  const counts = S.stages.map((s, i) => [s.name, S.leads.filter(l => l.stage_id === s.id).length, PAL[i % PAL.length], s.id]);
  const tot = S.leads.length || 1;
  let acc = 0;
  const grad = S.leads.length ? counts.map(c => { const a = acc; acc += c[1] / tot * 100; return c[2] + ' ' + a + '% ' + acc + '%'; }).join(',') : '#E5E7EB 0% 100%';
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) { const x = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); }
  const byM = months.map(m => { const ls = S.leads.filter(l => ym(l.created_at) === m); return [m, ls.filter(l => kindOf(l) === 'won').length, ls.filter(l => kindOf(l) === 'lost').length, ls.filter(l => kindOf(l) === 'open').length]; });
  const mx = Math.max(1, ...byM.map(r => r[1] + r[2] + r[3]));
  const seg = (m, kd, n, c) => '<i class="click" data-k="mo:' + m + ':' + kd + '" title="' + kd + ': ' + n + '" style="flex:' + n + ';background:' + c + '"></i>';
  const bars = byM.map(r => '<div class="mcol"><div class="stack" style="height:' + ((r[1] + r[2] + r[3]) / mx * 100) + '%">' + seg(r[0], 'won', r[1], '#16A34A') + seg(r[0], 'lost', r[2], '#DC2626') + seg(r[0], 'open', r[3], '#0EA5E9') + '</div><small class="click" data-k="mo:' + r[0] + '">' + MON[Number(r[0].slice(5)) - 1] + '</small></div>').join('');
  $('vDash').innerHTML = '<div class="kpis">' + K.map(kpi).join('') + '</div>' + dashDetail(today) +
    '<div class="grid2"><div class="card"><h3>Leads by status</h3><div class="dn"><div class="dw" data-t="' + S.leads.length + '"><div style="background:conic-gradient(' + grad + ')"></div></div><div>' +
    counts.map(c => '<div class="lg click" data-k="st:' + c[3] + '"><span class="dot" style="background:' + c[2] + '"></span>' + esc(c[0]) + ': <b>' + c[1] + '</b></div>').join('') + '</div></div></div>' +
    '<div class="card"><h3>Last 6 months</h3><div class="mon">' + bars + '</div><div class="lg" style="margin-top:8px"><span class="dot" style="background:#16A34A"></span>Won <span class="dot" style="background:#DC2626;margin-left:10px"></span>Lost <span class="dot" style="background:#0EA5E9;margin-left:10px"></span>Open</div></div></div>' +
    '<div class="grid2"><div class="card"><h3>Reasons for loss</h3>' + hbars(countBy(lost, l => l.lost_reason || 'No reason'), 'lr:') + '</div>' +
    '<div class="card"><h3>Leads by team member</h3>' + hbars(countBy(S.leads, l => l.assigned_to || 'none', k => k === 'none' ? 'Unassigned' : who(k)), 'tm:') + '</div></div>';
  $('vDash').querySelectorAll('.click[data-k]').forEach(c => c.onclick = () => pick(c.dataset.k));
  $('vDash').querySelectorAll('.dtl tr[data-id]').forEach(r => r.onclick = () => openLead(r.dataset.id));
  const dx = $('dkClose');
  if (dx) dx.onclick = () => { S.dk = ''; renderDash(); };
  const dw = $('vDash').querySelector('.dw');
  if (dw) {
    dw.style.cursor = 'pointer';
    dw.onclick = e => {
      const r = dw.getBoundingClientRect(), dx0 = e.clientX - r.left - r.width / 2, dy0 = e.clientY - r.top - r.height / 2;
      if (Math.hypot(dx0, dy0) < r.width / 2 - 26) return;
      const ang = (Math.atan2(dy0, dx0) * 180 / Math.PI + 450) % 360;
      let acc2 = 0;
      for (const c of counts) { acc2 += c[1] / tot * 360; if (ang < acc2) { pick('st:' + c[3]); return; } }
    };
  }
}

function repData() {
  const ls = S.leads.filter(l => { const k = ym(l.created_at); return k.slice(0, 4) === S.repY && (!S.repM || k.slice(5) === S.repM); });
  const rows = [];
  ls.forEach(l => {
    const st = stageOf(l.stage_id), its = itemsOf(l.id);
    (its.length ? its : [{}]).forEach((it, i) => rows.push({
      'Date': new Date(l.created_at).toLocaleDateString('en-GB'), 'Customer': l.name, 'Phone': l.phone || '', 'Email': l.email || '', 'Source': l.source || '',
      'Item': it.item || '', 'Part / Model No': it.part_no || '', 'Qty': nv(it.quantity), 'Price quoted': nv(it.price_quoted), 'Target price': nv(it.target_price),
      'Line value': it.price_quoted == null ? '' : (Number(it.quantity) || 1) * Number(it.price_quoted),
      'Status': st ? st.name : '', 'Assigned to': l.assigned_to ? who(l.assigned_to) : '', 'Follow-up on': l.follow_up_on || '',
      'Won price': i === 0 ? nv(l.won_price) : '', 'Lost reason': l.lost_reason || '', 'Notes': l.notes || ''
    }));
  });
  return { ls, rows };
}

function monthSummary() {
  return MON.map((n, i) => {
    const k = S.repY + '-' + String(i + 1).padStart(2, '0');
    const ls = S.leads.filter(l => ym(l.created_at) === k);
    const won = ls.filter(l => kindOf(l) === 'won');
    return { 'Month': n + ' ' + S.repY, 'Leads': ls.length, 'Won': won.length, 'Won value': won.reduce((a, l) => a + (Number(l.won_price) || 0), 0),
      'Lost': ls.filter(l => kindOf(l) === 'lost').length, 'Open': ls.filter(l => kindOf(l) === 'open').length,
      'Quoted value': ls.reduce((a, l) => a + sum(itemsOf(l.id), 'price_quoted'), 0) };
  });
}

const tbl = rows => rows.length
  ? '<table class="tbl"><thead><tr>' + Object.keys(rows[0]).map(k => '<th>' + esc(k) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + Object.values(r).map(v => '<td>' + esc(typeof v === 'number' ? num(v) : v) + '</td>').join('') + '</tr>').join('') + '</tbody></table>'
  : '<div class="empty">No leads in this period.</div>';

function renderRep() {
  const { ls, rows } = repData();
  const years = [...new Set(S.leads.map(l => ym(l.created_at).slice(0, 4)).concat(String(new Date().getFullYear())))].sort().reverse();
  const wonV = ls.filter(l => kindOf(l) === 'won').reduce((a, l) => a + (Number(l.won_price) || 0), 0);
  const K = [['Leads', ls.length, '#4F46E5'], ['Won', ls.filter(l => kindOf(l) === 'won').length, '#16A34A'], ['Won value', num(wonV), '#0D9488'], ['Lost', ls.filter(l => kindOf(l) === 'lost').length, '#DC2626']];
  $('vRep').innerHTML = '<div class="bar"><select id="rY">' + years.map(y => '<option' + (y === S.repY ? ' selected' : '') + '>' + y + '</option>').join('') + '</select>' +
    '<select id="rM"><option value="">All months</option>' + MON.map((n, i) => { const v = String(i + 1).padStart(2, '0'); return '<option value="' + v + '"' + (v === S.repM ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>' +
    '<button class="btn" id="rX">Download Excel</button></div><div class="kpis">' + K.map(kpi).join('') + '</div>' +
    (S.repM ? '' : '<div class="card"><h3>Month-wise summary, ' + S.repY + '</h3><div style="overflow-x:auto">' + tbl(monthSummary()) + '</div></div>') +
    '<div class="card"><h3>Details</h3><div style="overflow-x:auto">' + tbl(rows) + '</div></div>';
  $('rY').onchange = e => { S.repY = e.target.value; renderRep(); };
  $('rM').onchange = e => { S.repM = e.target.value; renderRep(); };
  $('rX').onclick = exportXlsx;
}

function exportXlsx() {
  if (typeof XLSX === 'undefined') { toast('Excel library did not load. Check your connection.'); return; }
  const { rows } = repData();
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthSummary()), 'Month-wise');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Details');
  XLSX.writeFile(wb, 'LeadDesk_' + S.wsName.replace(/\W+/g, '_') + '_' + S.repY + (S.repM ? '-' + S.repM : '') + '.xlsx');
}

/* ---------- Boot ---------- */
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    $('app').classList.add('hide');
    $('auth').classList.remove('hide');
    setMode(S.mode);
    return;
  }
  if (!(await loadWorkspace(data.session.user))) return;
  await loadData();
  $('auth').classList.add('hide');
  $('app').classList.remove('hide');
  render();
}

$('authBtn').onclick = submitAuth;
$('pass').onkeydown = e => { if (e.key === 'Enter') submitAuth(); };
$('logout').onclick = async () => { await sb.auth.signOut(); S.ws = null; boot(); };
$('add').onclick = () => openLead(null);
$('cancel').onclick = () => $('dlg').close();
$('save').onclick = saveLead;
$('del').onclick = deleteLead;
$('q').oninput = e => { S.q = e.target.value; renderList(); };
$('teamBtn').onclick = () => { renderTeam(); $('teamErr').textContent = ''; $('teamDlg').showModal(); };
$('teamClose').onclick = () => $('teamDlg').close();
$('teamAdd').onclick = addMember;
$('f_stage').onchange = syncOutcome;
$('addItem').onclick = () => addItemRow({});
$('wa').onclick = shareWhatsApp;
$('tabs').onclick = e => { const b = e.target.closest('button'); if (b) { S.view = b.dataset.v; renderView(); } };
boot();
</script>
</body>
